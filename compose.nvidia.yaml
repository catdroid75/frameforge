# Add to the base configuration with: docker compose -f compose.yaml -f compose.nvidia.yaml up -d --build
services:
  frameforge:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
