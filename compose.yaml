name: frameforge
services:
  frameforge:
    build: .
    image: frameforge:0.9.0-beta.8
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRAMEFORGE_PORT:-8765}:8765"
    user: "${FRAMEFORGE_UID:-1000}:${FRAMEFORGE_GID:-1000}"
    environment:
      FRAMEFORGE_AUTH_TOKEN: "${FRAMEFORGE_AUTH_TOKEN:-}"
      FRAMEFORGE_COOKIE_SECURE: "${FRAMEFORGE_COOKIE_SECURE:-false}"
      FRAMEFORGE_INPUT: /input
      FRAMEFORGE_OUTPUT: /output
      FRAMEFORGE_DATA: /data
      FRAMEFORGE_SMTP_ENABLED: "${FRAMEFORGE_SMTP_ENABLED:-}"
      FRAMEFORGE_SMTP_HOST: "${FRAMEFORGE_SMTP_HOST:-}"
      FRAMEFORGE_SMTP_PORT: "${FRAMEFORGE_SMTP_PORT:-}"
      FRAMEFORGE_SMTP_TLS: "${FRAMEFORGE_SMTP_TLS:-}"
      FRAMEFORGE_SMTP_USERNAME: "${FRAMEFORGE_SMTP_USERNAME:-}"
      FRAMEFORGE_SMTP_PASSWORD: "${FRAMEFORGE_SMTP_PASSWORD:-}"
      FRAMEFORGE_SMTP_SENDER: "${FRAMEFORGE_SMTP_SENDER:-}"
      FRAMEFORGE_SMTP_RECIPIENTS: "${FRAMEFORGE_SMTP_RECIPIENTS:-}"
      FRAMEFORGE_SMTP_ON_FAILURE: "${FRAMEFORGE_SMTP_ON_FAILURE:-}"
      FRAMEFORGE_SMTP_ON_FINISHED: "${FRAMEFORGE_SMTP_ON_FINISHED:-}"
      FRAMEFORGE_ORIGINS: "${FRAMEFORGE_ORIGINS:-http://127.0.0.1:${FRAMEFORGE_PORT:-8765},http://localhost:${FRAMEFORGE_PORT:-8765}}"
    volumes:
      - type: bind
        source: ${INPUT_DIR:-./input}
        target: /input
        read_only: true
      - type: bind
        source: ${OUTPUT_DIR:-./output}
        target: /output
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,urllib.parse; host=urllib.parse.urlparse(os.environ['FRAMEFORGE_ORIGINS'].split(',')[0]).netloc; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/healthz',headers={'Host':host}),timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
